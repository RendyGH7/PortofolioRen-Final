  <body class="bg-midnight-0 text-pearl font-sans selection:bg-champagne/30 selection:text-pearl min-h-screen antialiased overflow-x-hidden">
    <div id="root"></div>
    <!-- Safe Guard: Intercept third-party / browser extension visualizer exceptions so main app execution is never blocked -->
    <script>
      (function() {
        window.addEventListener('error', function(event) {
          if (event.filename && (event.filename.includes('visualizer.js') || event.filename.includes('chrome-extension://'))) {
            console.warn('[SafeGuard] Intercepted external script error to preserve application rendering:', event.message);
            event.preventDefault();
            return true;
          }
        });
        window.addEventListener('unhandledrejection', function(event) {
          var reason = String(event.reason || '');
          if (reason.includes('visualizer') || reason.includes('unsafe-eval')) {
            console.warn('[SafeGuard] Intercepted external promise rejection:', reason);
            event.preventDefault();
          }
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
